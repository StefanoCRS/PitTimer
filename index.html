<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pit Window Timer - Timekeeper</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#000;--fg:#fff;--card:#141414;--line:#3a3a3a;--red:#d50000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;gap:8px;padding:8px;min-height:100dvh}
header{border-bottom:3px solid var(--red);padding-bottom:6px}
header img{display:block;max-width:100%;max-height:48px;margin:0 auto}
#wrap{flex:1;display:grid;grid-template-columns:1fr;gap:8px;min-height:0}
#main{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{font-weight:700;cursor:pointer;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid label{font-size:12px;display:flex;flex-direction:column;gap:3px}
.grid input,.grid select{font-size:16px;padding:6px;border:1px solid var(--line);border-radius:6px;background:#000;color:#fff;width:100%}
.grid h4{grid-column:1/-1;margin:6px 0 0;font-size:13px;color:var(--red)}
.cnt{border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;background:#d50000;color:#fff;transition:background .2s;position:relative}
.cnt small{font-size:14px;letter-spacing:.15em;opacity:.85}
.cnt b{font-variant-numeric:tabular-nums;line-height:1.05}
.ds{font-size:.5em}
#up{flex:0 0 auto;flex-direction:row;gap:12px;padding:4px 10px}
#up b{font-size:min(7vw,30px)}
#dn{flex:1;min-height:34vh}
#dn>b{font-size:min(20vw,26vh)}
#dn.pitact>b{font-size:min(15vw,17vh)}
.cnt.yellow{background:#fdd835;color:#111}
.cnt.green{background:#2e7d32}
.cnt.flash{animation:bl .6s steps(1) infinite}
@keyframes bl{0%{background:#2e7d32;color:#fff}50%{background:#000;color:#2e7d32}}
#sub{position:absolute;right:10px;bottom:8px;text-align:right;background:rgba(0,0,0,.4);border-radius:8px;padding:4px 10px;color:#fff}
#sub b{display:block;font-size:min(9vw,44px)}
#sub small{font-size:11px;letter-spacing:.08em}
#pits{display:flex;width:100%;gap:8px;align-items:flex-start}
.pb{background:#fff;color:#000;border-radius:10px;padding:4px 12px;display:none;text-align:center}
#pb1{margin-left:auto}
.pb.on{display:block}.pb.over{background:#000;color:#fff;outline:4px solid #fff}
.pb b{display:block;font-size:min(18vw,16vh);line-height:1}
#pits.two .pb b{font-size:min(10vw,12vh)}
.pb small{font-size:13px;letter-spacing:.08em;font-weight:700;opacity:1}
.view details,.view .btns,.view .x{display:none}
#st{font-size:11px;opacity:.7;text-align:right}
#vn{display:none;gap:6px;align-items:center;justify-content:flex-end;font-size:12px;opacity:.8}.view #vn{display:flex}.vd{padding:4px 8px;font-size:12px;border-width:1px}
.lnk{display:block;padding:14px 4px;text-align:center;border:2px solid #d50000;border-radius:10px;background:#d50000;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
button{font-size:15px;font-weight:700;padding:14px 4px;border:2px solid var(--red);border-radius:10px;background:#000;color:#fff;cursor:pointer}
#go{grid-column:span 4;font-size:22px;background:var(--red)}#go.stop{background:#fff;color:#000}
#rst{grid-column:span 2}
button.sel{background:#fff;color:#000}
.nd{padding:10px 2px;font-size:13px}
#hint{font-size:11px;opacity:.6}
#lp{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;overflow:auto;max-height:36vh;min-height:0}
#laps{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-variant-numeric:tabular-nums;font-size:13px}
.col h5{margin:0 0 4px;padding:3px;text-align:center;background:#222;border-radius:5px;font-size:12px;letter-spacing:.1em}
.col.sel h5{background:var(--red)}
.r{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:2px 3px;border-bottom:1px solid var(--line)}
.r i{opacity:.6;font-style:normal;font-size:11px}
.r em{color:#ff5252;font-style:normal}
.x{padding:0 6px;font-size:13px;border:0;background:none;color:#ff5252}
@media(min-width:760px){
 #app{height:100dvh}
 #wrap{grid-template-columns:1fr 340px}
 #lp{max-height:none}
 #dn>b{font-size:min(12vw,34vh)}
 #dn.pitact>b{font-size:min(9vw,20vh)}
 .pb b{font-size:min(11vw,24vh)}
 #pits.two .pb b{font-size:min(6.5vw,20vh)}
 header img{max-height:60px}
}
</style>
</head>

  const sub=$('sub');
  if(t<o){sub.style.display='';$('subL').textContent=T('toOpen');$('subT').innerHTML=fd(o-t)}
  else if(t<c){sub.style.display='';$('subL').textContent=T('toClosed');$('subT').innerHTML=fd(c-t)}
  else sub.style.display='none';
  C.forEach((car,i)=>{const el=$('pb'+i),n=el.firstChild,v=el.lastChild;
    el.className='pb'+(car.st?' on':'');
    if(car.st===1){n.textContent=T('car')+' '+(i+1);v.textContent=T('pitlane');v.style.fontSize='min(8vw,6vh)'}
    else if(car.st===2){const r=S['pit'+(i+1)]-(now()-car.ts)/1000;n.textContent=T('pit')+' '+(i+1);v.style.fontSize='';v.innerHTML=r>=0?fd(r):'+'+fd(-r);if(r<0)el.className+=' over'}});
  const na=C.filter(c=>c.st).length;$('pits').className=na>1?'two':'';if(na)$('dn').className+=' pitact';
  if(ph!==lastPh&&run){try{navigator.vibrate&&navigator.vibrate(ph?[200,100,200]:300)}catch(e){}}
  lastPh=ph;
}
let silent,wl;
function wav(){const n=8000,b=new ArrayBuffer(44+n),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function toggle(){
  if(run){base=now();run=false;$('go').className='';$('go').dataset.t='b_start';try{wl&&wl.release()}catch(e){}}
  else{start=Date.now();run=true;$('go').className='stop';$('go').dataset.t='b_stop';
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wl=l)}catch(e){}
    try{if(!silent){silent=wav();$('aud').src=silent;$('aud').volume=.01}$('aud').play().catch(()=>{})}catch(e){}}
  $('go').textContent=T($('go').dataset.t);render();push();
}
const add=e=>{C[cur].laps.push(e);drawLaps();pushLazy()};
const tt=()=>now()/1000;
function lap(){
  if(!now())return;const L=C[cur].laps,t=tt();let last=0,span=1;
  for(let i=L.length-1;i>=0;i--){if(L[i].k==='lap'){last=L[i].t;break}if(L[i].k==='mark')span++}
  add({k:'lap',t,split:t-last,span});
}
const mark=()=>now()&&add({k:'mark',t:tt()});
function pit(){if(!now())return;const car=C[cur];if(!car.st){car.st=1;add({k:'pit',t:tt()})}else{if(car.st===2)add({k:'go',t:tt(),dur:(now()-car.ts)/1000});car.st=0;add({k:'out',t:tt()})}render();push()}
function box(){
  if(!now())return;const car=C[cur];
  if(car.st!==2){car.st=2;car.ts=now();add({k:'stop',t:tt()})}
  else{add({k:'go',t:tt(),dur:(now()-car.ts)/1000});car.st=0}
  render();push()
}
function selCar(i){cur=i;$('c0').className=i===0?'sel':'';$('c1').className=i===1?'sel':'';drawLaps();pushLazy()}
function drawLaps(){
  $('laps').innerHTML=C.map((car,i)=>{let n=car.o||0;
    const rows=car.laps.map((e,j)=>{
      let h;
      if(e.k==='lap'){n++;h='<span>#'+n+' '+ft(e.split)+(e.span>1?' <em>×'+e.span+'</em>':'')+'</span>'}
      else if(e.k==='mark'){n++;h='<span>#'+n+' <em>'+T('mark')+'</em></span><i>'+fmt(e.t)+'</i>'}
      else h='<span><em>'+T('e_'+e.k)+'</em>'+(e.k==='go'?' '+ft(e.dur):'')+'</span><i>'+fmt(e.t)+'</i>';
      return '<div class="r">'+h+'<button class="x" data-c="'+i+'" data-j="'+j+'">✕</button></div>'}).join('');
    return '<div class="col'+(i===cur?' sel':'')+'"><h5>'+T('car')+' '+(i+1)+'</h5>'+rows+'</div>'}).join('');$('lp').scrollTop=1e6;
}
$('laps').addEventListener('click',e=>{const b=e.target.closest('.x');if(!b)return;C[+b.dataset.c].laps.splice(+b.dataset.j,1);drawLaps();pushLazy()});
let rc=0;
function reset(){
  if(Date.now()-rc>3000){rc=Date.now();$('rst').textContent=T('b_conf');setTimeout(()=>$('rst').textContent=T('b_reset'),3000);return}
  rc=0;run=false;base=0;C.forEach(c=>{c.laps=[];c.st=0;c.ts=0});setTimeout(push,0);$('go').className='';$('go').dataset.t='b_start';applyLang();render();
}
function setEl(sec){base=sec*1000-(run?Date.now()-start:0);render();push()}
const parseT=s=>{const p=s.trim().split(':').map(Number);return(!p.length||p.some(isNaN))?NaN:p.reduce((a,x)=>a*60+x,0)};
$('syGo').onclick=()=>{const v=parseT($('syVal').value);if(isNaN(v))return;setEl($('syMode').value==='rem'?S.total*60-v:v)};
document.querySelectorAll('.nd').forEach(b=>b.onclick=()=>setEl(now()/1000+parseFloat(b.dataset.d)));
$('cp').onclick=async()=>{try{await navigator.clipboard.writeText(LINK);$('cp').textContent=T('copied')}catch(e){$('lnk').select()}setTimeout(()=>$('cp').textContent=T('copy'),2000)};
$('go').onclick=toggle;$('lapB').onclick=lap;$('markB').onclick=mark;$('pitB').onclick=pit;$('boxB').onclick=box;$('rst').onclick=reset;
$('c0').onclick=()=>selCar(0);$('c1').onclick=()=>selCar(1);
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')e.target.blur()});
document.addEventListener('keydown',e=>{
  const k=e.key;if(role!=='op'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(/INPUT|SELECT|SUMMARY/.test(document.activeElement.tagName)&&k!=='AudioVolumeUp'&&k!=='AudioVolumeDown')return;
  if(k===' '||k==='AudioVolumeUp'||k==='AudioVolumeDown'||k==='MediaPlayPause'){e.preventDefault();toggle()}
  else if(k==='l'||k==='L'||k==='MediaTrackNext'){e.preventDefault();lap()}
  else if(k==='m'||k==='M')mark();
  else if(k==='p'||k==='P')pit();
  else if(k==='s'||k==='S')box();
  else if(k==='1')selCar(0);else if(k==='2')selCar(1);
  else if(k==='r'||k==='R')reset();
});
try{const ms=navigator.mediaSession;if(ms){
  ms.metadata=new MediaMetadata({title:'Pit Window Timer'});
  ms.setActionHandler('play',()=>{if(!run)toggle()});
  ms.setActionHandler('pause',()=>{if(run)toggle()});
  ms.setActionHandler('nexttrack',lap);ms.setActionHandler('previoustrack',lap);
}}catch(e){}

const K={lap:'l',mark:'m',pit:'p',stop:'s',go:'g',out:'o'};
const r1=x=>Math.round((x||0)*10)/10;
const snap=()=>({S,run,base,start,cur,cars:C.map(c=>({laps:c.laps,st:c.st,ts:c.ts}))});
const save=()=>{try{localStorage.setItem('pitstate',JSON.stringify(snap()))}catch(e){}};
function pack(){const s={...S};delete s.topic;
 const cars=C.map(c=>({st:c.st,ts:c.ts,o:0,l:c.laps.map(e=>[K[e.k],r1(e.t),r1(e.k==='go'?e.dur:e.split),e.span||0])}));
 let m;for(;;){m=JSON.stringify({S:s,run,base,start,cur,cars});if(m.length<3800)break;
  const c=cars[0].l.length>=cars[1].l.length?cars[0]:cars[1];if(!c.l.length)break;
  const e=c.l.shift();if(e[0]==='l'||e[0]==='m')c.o++}
 return m}
let wr=0,dirty=0,pt,lz=0;
function push(){save();dirty=1;if(wr)return;wr=1;dirty=0;
 fetch('https://ntfy.sh/'+S.topic,{method:'POST',body:pack()}).then(r=>{$('st').textContent=r.ok?'● LIVE':'⚠ ntfy error '+r.status}).catch(()=>{$('st').textContent='⚠ NO CONNECTION'}).finally(()=>{wr=0;if(dirty)push()})}
function pushLazy(){save();if(lz)return;lz=setTimeout(()=>{lz=0;push()},4000)}
function pushSoon(){clearTimeout(pt);pt=setTimeout(push,500)}
function applyState(d){S=Object.assign({},D,d.S||{});run=!!d.run;base=d.base||0;start=d.start||0;cur=d.cur||0;
 (d.cars||[]).forEach((c,i)=>{if(C[i])C[i]={laps:c.laps||[],st:c.st||0,ts:c.ts||0}});
 [...F.map(f=>f[0]),'lang'].forEach(k=>$(k).value=S[k]);
 $('go').className=run?'stop':'';$('go').dataset.t=run?'b_stop':'b_start';
 $('c0').className=cur===0?'sel':'';$('c1').className=cur===1?'sel':'';
 applyLang();render()}
if(!S.topic){S.topic='pit-'+[...crypto.getRandomValues(new Uint8Array(10))].map(b=>(b%36).toString(36)).join('');try{localStorage.setItem('pitset2',JSON.stringify(S))}catch(e){}}
try{const st=JSON.parse(localStorage.getItem('pitstate')||'null');if(st){const tp=S.topic;applyState(st);S.topic=tp}}catch(e){}
const setLink=()=>{LINK=new URL('viewer.html',location.href).href+'#'+S.topic};
setLink();$('topic').value=S.topic;
$('topic').oninput=()=>{S.topic=$('topic').value.trim().replace(/[^A-Za-z0-9_-]/g,'')||S.topic;try{localStorage.setItem('pitset2',JSON.stringify(S))}catch(e){}setLink();applyLang();push()};
applyLang();setInterval(render,100);render();$('st').textContent='● TIMEKEEPER';
</script>
